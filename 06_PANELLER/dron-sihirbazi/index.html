<style>

@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.total { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.total b { font-size: 15px; }
.steps { display: flex; gap: 4px; margin-top: 8px; }
.steps button { flex: 1; height: 6px; padding: 0; border: 0; border-radius: 3px; background: var(--line); cursor: pointer; }
.steps button.done { background: var(--muted); }
.steps button.cur { background: var(--accent); }
.stepname { font-size: 12px; color: var(--muted); margin-top: 5px; }
main { max-width: 760px; margin: 0 auto; padding: 14px 14px 96px; }

.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }

label.opt input { position: absolute; opacity: 0; pointer-events: none; }

label.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
label.opt.dis { opacity: .55; }
.opt svg.ico { width: 62px; height: 46px; color: var(--ink); }
.opt .nm { font-weight: 600; }
.opt .sp { font-size: 12.5px; color: var(--muted); }
.opt .pr { font-family: var(--font-mono); font-size: 12.5px; margin-top: 2px; }
.opt .pr a { color: var(--info); }

.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.row label { font-weight: 500; }
.row small { display: block; color: var(--muted); font-weight: 400; }
.row input[type=number] { width: 92px; font: inherit; font-family: var(--font-mono); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); text-align: right; }
.row input[type=range] { width: 46%; accent-color: var(--accent); }
.chk { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.chk input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
.chk .pr { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.chk small { display: block; color: var(--muted); }
.note { border-left: 3px solid var(--line); padding: 6px 10px; margin: 8px 0; font-size: 13.5px; border-radius: 0 6px 6px 0; background: var(--surface); }
.note.ok { border-color: var(--ok); } .note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); } .note.info { border-color: var(--info); }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.kpi .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
.kpi .l { font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
tr.sum td { font-weight: 600; border-bottom: 0; }
td small { color: var(--muted); display: block; }
td a { color: var(--info); }
.grand { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 14px; margin: 14px 0; display: flex; justify-content: space-between; align-items: baseline; }
.grand b { font-family: var(--font-mono); font-size: 22px; }
nav.bot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
nav.bot button, .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 11px 18px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-width: 120px; }

textarea.copy { width: 100%; height: 160px; font-family: var(--font-mono); font-size: 12px; margin-top: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.foot { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
@media (max-width: 420px) { .opts.two { grid-template-columns: 1fr; } }
</style>

}

  return ESCS.filter(function (e) { if (e.s.indexOf(v) < 0) return false; if (e.n === 4 && (S.type !== "mr" || n % 4 !== 0)) return false; if (S.type === "mr" && e.id === "at115") return false; return true; })
    .map(function (e) { return { e: e, ok: !m || e.a >= m.peakA }; });
}
function selEsc() { var m = selMotor(); if (!m || m.integrated) return null; var l = escList(); for (var i = 0; i < l.length; i++) if (l[i].e.id === S.esc) return l[i].e; return null; }
function battList() { var v = sysS(); return BATTS.filter(function (b) { return b.s === v || (v === 12 && b.s === 6); }); }

function battCount() { var b = selBatt(); if (!b) return 0; var n = Math.max(1, Math.round(+S.battN || 1)); if (sysS() === 12 && b.s === 6 && n % 2) n += 1; return n; }
function selEngine() { return isGas() ? byId(ENGINES, S.engine) : null; }
function visionNeeded() { return S.camNav !== "none" || S.camIns !== "none" || S.gnssless || S.track; }

/* Araçtaki Operfly kartları ve gerekçeleri */
function opAir() {
  var a = [["core", "zorunlu"], ["hub", "zorunlu"], ["power", "zorunlu"], ["nav", "zorunlu"], ["rx", "zorunlu"]];
  if (S.radio || S.swarm) a.push(["radio", S.swarm && !S.radio ? "sürü haberleşmesi için" : "seçildi"]);
  if (visionNeeded()) a.push(["vision", S.camIns !== "none" || S.camNav !== "none" ? "kameralar buna bağlanır" : "GNSS'siz uçuş / hedef takibi için"]);

}

/* Satın alınacaklar listesi */
function buyList() {
  var L = [], n = nMotors(), m = selMotor(), e = selEsc(), b = selBatt(), g = selEngine();
  function add(name, qty, unit, o) { o = o || {}; L.push({ name: name, qty: qty, unit: unit, total: qty * unit, src: o.src, est: !!o.est, note: o.note, w: (o.w || 0) * qty, wEst: !!o.wEst }); }
  if (m) {
    add(m.name, n, m.price, { src: m.src, w: m.w, wEst: m.wEst || m.custom, est: m.custom, note: m.custom ? "sizin girdiğiniz değer" : m.priceNote });
    if (m.prop && !m.integrated) add(m.prop.name, n, m.prop.price, { src: m.prop.src, est: m.prop.est, w: m.prop.w, wEst: true });
    if (m.custom) add("Pervane (motorunuza uygun)", n, 100, { est: true, w: 100, wEst: true });
  }
  if (e) add(e.name, Math.ceil(n / e.n), e.price, { src: e.src, w: e.w, wEst: e.wEst });
  if (g) {
    add(g.name, 1, g.price, { src: g.src, w: g.w, note: g.priceNote || g.priceSrcNote });
    add("Benzinli motor pervanesi", 1, 80, { est: true, w: 250, wEst: true });
    add("Yakıt deposu ve hortum seti (" + num(+S.tank) + " L)", 1, 60, { est: true, w: 400, wEst: true });
    if (S.gen) add("Jeneratör + regülatör (model seçilmedi)", 1, 400, { est: true, w: 600, wEst: true });
    add("Aviyonik bataryası, 6S 10000 mAh", 1, 180, { est: true, w: 1300, wEst: true });
  }
  if (b) add(b.name, battCount(), b.price, { src: b.src, w: b.w });
  if (S.type === "fw") add(SERVO.name, Math.max(0, Math.round(+S.servos || 0)) + (isGas() ? 1 : 0), SERVO.price, { src: SERVO.src, w: SERVO.w, note: isGas() ? "gaz servosu dahil" : "" });
  var cn = byId(CAM_NAV, S.camNav), ci = byId(CAM_INS, S.camIns);
  if (cn && cn.id !== "none") add(cn.name + " (seyir kamerası)", 1, cn.price, { src: cn.src, w: cn.w, wEst: cn.wEst });
  if (ci && ci.id !== "none") { add(ci.name + " (INS kamerası)", 1, ci.price, { src: ci.src, w: ci.w }); add("INS kamerası merceği (CS bağlantı)", 1, 60, { est: true, w: 40, wEst: true }); }
  add("Güç kabloları, konnektörler, bağlantı elemanları", 1, S.mtow > 20 ? 250 : 120, { est: true, w: S.mtow > 20 ? 800 : 300, wEst: true });
  return L;
}
function opList(arr) { return arr.map(function (x) { var o = OP[x[0]]; return { key: x[0], name: o.name, d: o.d, why: x[1], total: o.cost, w: o.w || 0, pw: o.pw || 0, ports: o.ports || 0, ground: !!o.ground }; }); }

/* Hesaplar ve denetimler */
function calc() {
  var R = { checks: [] }, n = nMotors(), m = selMotor(), e = selEsc(), b = selBatt(), g = selEngine();
  function chk(lvl, t) { R.checks.push({ lvl: lvl, t: t }); }
  var air = opList(opAir()), ground = opList(opGround()), buy = buyList();
  R.air = air; R.ground = ground; R.buy = buy;
  R.costOp = air.concat(ground).reduce(function (a, x) { return a + x.total; }, 0);
  R.costBuy = buy.reduce(function (a, x) { return a + x.total; }, 0);
  R.wParts = (buy.reduce(function (a, x) { return a + x.w; }, 0) + air.reduce(function (a, x) { return a + x.w; }, 0)) / 1000;
  var fuelKg = g ? (+S.tank || 0) * 0.74 : 0;
  R.wParts += fuelKg;
  R.wFrame = S.mtow - S.payload - R.wParts;
  // İtki / güç
  if (isElec()) {
    if (!m) chk("bad", "Motor seçilmedi.");
    else {
      var coax = S.type === "mr" && LAYOUTS[S.layout].coax;
      R.thrust = m.thrust * n * (coax ? 0.85 : 1);
      R.tw = R.thrust / S.mtow;
      if (S.type === "mr") {
        if (R.tw >= 2) chk("ok", "İtki yeterli: toplam " + num(R.thrust) + " kg, ağırlığın " + num(R.tw, 2) + " katı.");
        else if (R.tw >= 1.6) chk("warn", "İtki sınırda: toplam " + num(R.thrust) + " kg, ağırlığın " + num(R.tw, 2) + " katı. Rüzgârda ve manevrada pay az; hedef en az 2 kat.");
        else chk("bad", "İtki yetersiz: toplam " + num(R.thrust) + " kg, ağırlığın " + num(R.tw, 2) + " katı. Bu MTOW için motor başına en az " + num(S.mtow * 2 / n / (coax ? 0.85 : 1)) + " kg itki gerekir.");
      } else {
        if (R.tw >= 0.4) chk("ok", "İtki yeterli: " + num(R.thrust) + " kg, ağırlığın " + num(R.tw, 2) + " katı.");
        else if (R.tw >= 0.25) chk("warn", "İtki sınırda: ağırlığın " + num(R.tw, 2) + " katı. Uzun pist veya mancınık gerekebilir; hedef 0,4.");
        else chk("bad", "İtki yetersiz: ağırlığın " + num(R.tw, 2) + " katı. İkinci motor ekleyin veya MTOW'u düşürün.");
      }
      if (!m.integrated) {
        if (!e) chk("bad", "ESC seçilmedi.");
        else if (e.a < m.peakA) chk("bad", "ESC akımı yetersiz: motor " + num(m.peakA, 0) + " A çekebilir, ESC " + e.a + " A.");
        else chk("ok", "ESC uygun: " + e.a + " A, motorun en yüksek akımı " + num(m.peakA, 0) + " A.");
      }
    }
    if (!b) chk("bad", "Batarya seçilmedi.");
    else {
      R.wh = b.wh * battCount();
      var tw = R.tw || 2, effK = S.type === "mr" ? (0.2 + 0.4 * Math.min(tw, 2)) * (LAYOUTS[S.layout].coax ? 0.85 : 1) : 1;
      var p = S.type === "mr" ? (S.mtow * 1000) / ((m ? m.eff : 9) * effK) : S.mtow * 41;
      if (S.type === "mr" && m && tw < 1.05) chk("bad", "Bu motorlarla araç bu ağırlıkta havalanamaz; uçuş süresi hesaplanmadı.");
      else { R.pCruise = p; R.endur = R.wh * 0.8 / p * 60;
      chk("info", (S.type === "mr" ? "Askıda" : "Seyirde") + " güç yaklaşık " + num(p / 1000, 1) + " kW; tahmini uçuş süresi " + num(R.endur, 0) + " dakika (bataryanın %80'i ile, kaba tahmin)."); }
      if (m && S.type === "mr") { var iMax = m.peakA * n; var c = b.id === "6s22" ? 30 : 25; var cap = (b.wh / (b.s * 3.7)) * (sysS() === 12 && b.s === 6 ? battCount() / 2 : battCount()); if (iMax > cap * c) chk("warn", "Tam gazda toplam akım (" + num(iMax, 0) + " A) bataryanın sürekli akım sınırını (" + num(cap * c, 0) + " A) aşıyor."); }
    }
    if (sysS() === 12 && S.type === "mr") chk("info", "12S seçtiniz. Power kartı 12S'yi destekler; ancak \"şimdilik en büyük batarya 6S\" kararınızla çelişir.");
  } else {
    if (!g) chk("bad", "Benzinli motor seçilmedi.");
    else {
      R.hpkg = g.hp / S.mtow;
      if (R.hpkg >= 0.12) chk("ok", "Motor gücü yeterli: " + num(g.hp) + " hp, kg başına " + num(R.hpkg, 2) + " hp.");
      else if (R.hpkg >= 0.08) chk("warn", "Motor gücü sınırda: kg başına " + num(R.hpkg, 2) + " hp. Hedef 0,12; kalkış mesafesi uzar.");
      else chk("bad", "Motor gücü yetersiz: kg başına " + num(R.hpkg, 2) + " hp. Bu MTOW için en az " + num(S.mtow * 0.12) + " hp gerekir.");
      var burn = g.hp * 0.746 * 0.5 * 0.6;
      R.endur = fuelKg / burn * 60;
      chk("info", "Yarı güçte yakıt tüketimi yaklaşık " + num(burn / 0.74, 1) + " L/saat; " + num(+S.tank) + " L depo ile tahmini " + num(R.endur / 60, 1) + " saat (kaba tahmin).");
      if (!S.gen) chk("warn", "Jeneratör yok: aviyonik yalnızca bataryadan beslenir, uçuş süresi aviyonik bataryasıyla sınırlanır.");
    }
  }
  // Ağırlık bütçesi
  if (S.payload >= S.mtow) chk("bad", "Faydalı yük MTOW'dan küçük olmalı.");
  var fr = R.wFrame / S.mtow;
  if (R.wFrame < 0) chk("bad", "Ağırlık bütçesi aşıldı: parçalar + faydalı yük MTOW'u " + num(-R.wFrame) + " kg geçiyor.");
  else if (fr < 0.2) chk("warn", "Gövde için yalnızca " + num(R.wFrame) + " kg kalıyor (MTOW'a oranı %" + num(fr * 100, 0) + "). Tipik gövde payı %25–35.");
  else chk("ok", "Gövde, iniş takımı ve montaj için " + num(R.wFrame) + " kg kalıyor (MTOW'a oranı %" + num(fr * 100, 0) + ").");
  // Operfly sınırları
  R.ports = air.reduce(function (a, x) { return a + x.ports; }, 0);
  R.pw = air.reduce(function (a, x) { return a + x.pw; }, 0);

  else chk("ok", "Hub portları: 12'den " + R.ports + " tanesi dolu.");
  if (R.pw > 150) chk("bad", "Omurga gücü aşıldı: " + R.pw + " W (sınır 150 W)."); else chk("ok", "Omurga gücü: yaklaşık " + R.pw + " W (sınır 150 W, tahmin).");
  var outs = (isElec() ? n : 1) + (S.type === "fw" ? Math.round(+S.servos || 0) : 0);

  if (S.camNav !== "none" && !S.radio && !S.cell && !S.swarm) chk("warn", "Seyir kamerası var ama görüntüyü yere taşıyacak Radio veya Cell seçilmedi.");
  if (S.shield) chk("info", "Shield takılıyken Nav yalnızca L1 ile çalışır; karıştırma koruması sırasında çok bantlı RTK devre dışı kalır.");
  if (S.base && !S.radio && !S.cell) chk("warn", "RTK düzeltmesini araca taşımak için Radio veya Cell gerekir.");
  if (S.tracker && !S.radio) chk("warn", "Tracker, Radio bağlantısının yer anteni içindir; Radio seçili değil.");
  R.total = R.costOp + R.costBuy;
  return R;
}

/* ---------- Arayüz parçaları ---------- */
function opt(key, val, icon, name, sp, pr, o) {
  o = o || {}; var sel = String(S[key]) === String(val);
  return '<label class="opt' + (sel ? " sel" : "") + (icon ? "" : " plain") + '"><input type="radio" name="' + key + '" data-k="' + key + '" value="' + esc(val) + '"' + (sel ? " checked" : "") + '>' + (icon ? ico(icon) : "") +
    '<span><span class="nm">' + name + (o.badge || "") + '</span>' + (sp ? '<span class="sp"><br>' + sp + '</span>' : "") + (pr ? '<div class="pr">' + pr + '</div>' : "") + '</span></label>';
}
function priceLine(p) { if (!p.price) return ""; return money(p.price) + (p.est ? " (tahmin)" : "") + (p.priceNote ? " · " + p.priceNote : "") + (p.src ? ' · <a href="' + p.src + '" target="_blank" rel="noopener">satıcı</a>' : ""); }
function numRow(key, label, small, min, max, step, unit) { return '<div class="row"><label for="f-' + key + '">' + label + (small ? "<small>" + small + "</small>" : "") + '</label><span><input id="f-' + key + '" type="number" inputmode="decimal" data-k="' + key + '" data-num="1" min="' + min + '" max="' + max + '" step="' + step + '" value="' + esc(key.indexOf("cm.") === 0 ? S.cm[key.slice(3)] : S[key]) + '"> ' + (unit || "") + '</span></div>'; }
function chkRow(key, o, why, locked) { var on = locked || !!S[key]; return '<label class="chk"><input type="checkbox" data-k="' + key + '"' + (on ? " checked" : "") + (locked ? " disabled" : "") + '><span><b>' + o.name + '</b><small>' + o.d + (why ? " · <i>" + why + "</i>" : "") + '</small></span><span class="pr">' + money(o.cost) + '</span></label>'; }
function notes(list) { return list.map(function (c) { return '<div class="note ' + c.lvl + '">' + c.t + '</div>'; }).join(""); }
function badge(lvl, t) { return '<span class="badge ' + lvl + '">' + t + '</span>'; }

/* ---------- Adımlar ---------- */
var VIEW = [
  function () {
    return '<h2>Hangi aracı topluyoruz?</h2><p class="lead">Seçiminize göre gereken Operfly kartları ve satın alınacak parçalar belirlenir.</p><div class="fig">' + svgAir() + '</div><div class="opts">' +
      opt("type", "mr", "quad", "Multirotor", "Dikey kalkış, askıda kalma. Elektrikli.") + opt("type", "fw", "wing", "Sabit kanat", "Uzun menzil ve süre. Elektrikli veya benzinli.") + '</div>';
  },
  function () {
    var h = '<h2>Yapı</h2><div class="fig">' + svgAir() + '</div>';
    if (S.type === "mr") {
      h += '<h3>Motor yerleşimi</h3><div class="opts two">';
      for (var k in LAYOUTS) h += opt("layout", k, "", LAYOUTS[k].name, LAYOUTS[k].coax ? "4 kol, kol başına 2 motor; itki %15 düşer, motor arızasına dayanıklı" : LAYOUTS[k].n >= 6 ? "Bir motor kaybında kontrol korunabilir" : "En basit ve hafif; motor kaybında düşer");
      h += '</div>';
    } else {
      h += '<h3>Tahrik</h3><div class="opts two">' + opt("fwDrive", "gas", "engine", "Benzinli", "Uzun uçuş süresi; Engine kartı gerekir") + opt("fwDrive", "elec", "motor", "Elektrikli", "Sessiz ve basit; süre bataryayla sınırlı") + '</div>';
      h += '<h3>Motor konumu</h3><div class="opts two">' + opt("fwPos", "tractor", "", "Burunda (çekici)", "Pervane önde") + opt("fwPos", "pusher", "", "Kuyrukta (itici)", "Burun kamera ve sensöre kalır") + '</div>';
      if (S.fwDrive === "elec") h += '<h3>Motor sayısı</h3><div class="opts two">' + opt("fwMotors", 1, "", "Tek motor", "") + opt("fwMotors", 2, "", "Çift motor", "Kanatlarda; yedeklilik sağlar") + '</div>';
      h += '<h3>Kanat</h3><div class="row"><label for="f-span">Kanat açıklığı<small>' + num(+S.span) + ' m</small></label><input id="f-span" type="range" data-k="span" data-num="1" min="1.5" max="6" step="0.1" value="' + S.span + '"></div>';
      h += numRow("servos", "Kontrol yüzeyi servosu", "kanatçık, irtifa, istikamet, flap", 2, 11, 1, "adet");
    }
    return h;
  },
  function () {
    var h = '<h2>Ağırlık</h2><p class="lead">Parça seçenekleri bu değerlere göre değerlendirilir.</p>' +
      numRow("mtow", "En yüksek kalkış ağırlığı (MTOW)", "araç + batarya/yakıt + faydalı yük", 1, 150, 0.5, "kg") + numRow("payload", "Faydalı yük", "kamera, yük, görev ekipmanı", 0, 100, 0.5, "kg");
    if (S.type === "mr") h += '<h3>Batarya gerilimi</h3><div class="opts two">' + opt("volt", 6, "batt", "6S (22,2 V)", "Şimdiki kararınız: en büyük batarya 6S") + opt("volt", 12, "batt", "12S (44,4 V)", "Ağır araçlarda akım yarıya iner; Power destekler") + '</div>';
    else if (S.fwDrive === "elec") h += '<div class="note info">Elektrikli sabit kanat için listedeki motor 10–12S çalışır; sistem 12S alınır.</div>';
    var n = nMotors();
    if (S.type === "mr") h += '<div class="note info">Bu ağırlıkta ' + n + ' motorla, motor başına en az <b>' + num(S.mtow * 2 / n / (LAYOUTS[S.layout].coax ? 0.85 : 1)) + ' kg</b> itki gerekir (ağırlığın 2 katı kuralı).</div>';
    else if (isGas()) h += '<div class="note info">Bu ağırlık için en az <b>' + num(S.mtow * 0.12) + ' hp</b> motor önerilir (kg başına 0,12 hp kuralı).</div>';
    else h += '<div class="note info">Bu ağırlık için toplam en az <b>' + num(S.mtow * 0.4) + ' kg</b> itki önerilir (ağırlığın 0,4 katı).</div>';
    return h;
  },
  function () {
    var h = '<h2>Tahrik</h2>', n = nMotors();
    if (isGas()) {
      h += '<p class="lead">Satıştaki benzinli motorlar. Gerekli güç: en az ' + num(S.mtow * 0.12) + ' hp.</p><div class="opts">';
      ENGINES.forEach(function (g) { var r = g.hp / S.mtow; h += opt("engine", g.id, "engine", g.name, g.sp, priceLine(g), { badge: r >= 0.12 ? badge("ok", "yeterli") : r >= 0.08 ? badge("warn", "sınırda") : badge("bad", "yetersiz") }); });
      h += '</div><h3>Yakıt ve elektrik</h3>' + numRow("tank", "Yakıt deposu", "", 1, 40, 0.5, "L") +
        '<label class="chk"><input type="checkbox" data-k="gen"' + (S.gen ? " checked" : "") + '><span><b>Jeneratör</b><small>Aviyoniği uçuş boyunca besler; Power kartının ikinci girişine bağlanır</small></span><span class="pr">' + money(400) + ' (tahmin)</span></label>';
      return h;
    }
    var need = S.type === "mr" ? S.mtow * 2 / n / (LAYOUTS[S.layout].coax ? 0.85 : 1) : S.mtow * 0.4 / n;
    h += '<p class="lead">' + sysS() + 'S ile çalışan, satıştaki motorlar. ' + n + ' adet alınır; motor başına gereken itki en az ' + num(need) + ' kg.</p><div class="opts">';
    var ml = motorList();
    ml.forEach(function (m) { var r = m.thrust / need; h += opt("motor", m.id, m.integrated ? "integ" : "motor", m.name, m.sp, priceLine(m) + " / adet", { badge: r >= 1 ? badge("ok", "yeterli") : r >= 0.8 ? badge("warn", "sınırda") : badge("bad", "yetersiz") }); });
    h += opt("motor", "custom", "motor", "Listede yok, kendi motorumu gireceğim", "İtki, ağırlık, akım ve fiyatı siz yazın") + '</div>';
    if (!ml.length) h += '<div class="note warn">Bu gerilimde listede hazır motor yok; kendi motorunuzu girin veya gerilimi değiştirin.</div>';
    if (S.motor === "custom") h += numRow("cm.thrust", "En yüksek itki", "motor başına", 0.5, 100, 0.1, "kg") + numRow("cm.w", "Ağırlık", "motor başına", 10, 5000, 1, "g") + numRow("cm.peakA", "En yüksek akım", "", 1, 400, 1, "A") + numRow("cm.price", "Fiyat", "motor başına", 0, 5000, 1, "$");
    var m = selMotor();
    if (m && m.prop && !m.integrated) h += '<div class="note info">Pervane otomatik eklenir: ' + m.prop.name + ', ' + n + ' adet × ' + money(m.prop.price) + (m.prop.est ? " (tahmin)" : "") + '.</div>';
    if (m && m.integrated) h += '<div class="note ok">Bu ürün motor, ESC ve pervaneyi birlikte içerir; ayrıca ESC seçmeniz gerekmez.</div>';
    else if (m) {
      h += '<h3>ESC</h3><div class="opts">';
      var el = escList();
      el.forEach(function (x) { var e = x.e; h += opt("esc", e.id, e.n === 4 ? "esc4" : "esc", e.name, e.sp + (e.n === 4 ? " · " + Math.ceil(n / 4) + " adet gerekir" : " · " + n + " adet gerekir"), priceLine(e) + " / adet", { badge: x.ok ? badge("ok", "uygun") : badge("bad", "akım yetersiz") }); });
      h += '</div>';
      if (!el.length) h += '<div class="note warn">Bu gerilim için listede ESC yok.</div>';
    }
    return h;
  },
  function () {
    var h = '<h2>Enerji</h2>';
    if (isGas()) {
      var g = selEngine();
      h += '<p class="lead">Benzinli araçta tahrik yakıttan, aviyonik bataryadan ve jeneratörden beslenir.</p><div class="opts"><label class="opt sel">' + ico("batt") + '<span><span class="nm">Aviyonik bataryası, 6S 10000 mAh</span><span class="sp"><br>Otomatik eklenir; jeneratör arızasında yedek güç</span><div class="pr">' + money(180) + ' (tahmin)</div></span></label></div>' + numRow("tank", "Yakıt deposu", "Tahrik adımındaki değerle aynı", 1, 40, 0.5, "L");
      if (!g) h += '<div class="note bad">Önce Tahrik adımında bir motor seçin.</div>';
      return h + notes(calc().checks.filter(function (c) { return c.t.indexOf("yakıt") >= 0 || c.t.indexOf("Jeneratör") >= 0; }));
    }
    h += '<p class="lead">' + sysS() + 'S sistem için satıştaki bataryalar.</p><div class="opts">';
    battList().forEach(function (b) { h += opt("batt", b.id, "batt", b.name, b.sp + (sysS() === 12 && b.s === 6 ? " · ikişerli seri bağlanır" : ""), priceLine(b) + " / adet"); });
    h += '</div>' + numRow("battN", "Batarya adedi", sysS() === 12 && selBatt() && selBatt().s === 6 ? "çift sayı olmalı; şu an " + battCount() : "paralel bağlanır", 1, 12, 1, "adet");
    var R = calc();
    if (R.wh) h += '<div class="kpis"><div class="kpi"><div class="v">' + num(R.wh, 0) + ' Wh</div><div class="l">toplam enerji</div></div><div class="kpi"><div class="v">' + (R.endur ? num(R.endur, 0) + " dk" : "—") + '</div><div class="l">tahmini uçuş süresi</div></div></div>';
    return h + notes(R.checks.filter(function (c) { return /Batarya|akım sınır|güç yaklaşık|Ağırlık|Gövde/.test(c.t); }));
  },
  function () {
    var h = '<h2>Kameralar</h2><p class="lead">İki kamera da Ethernet ile Vision kartına bağlanır. Kamera seçerseniz Vision otomatik eklenir.</p><h3>Seyir kamerası (öne bakar)</h3><div class="opts">';
    CAM_NAV.forEach(function (c) { h += opt("camNav", c.id, c.id === "none" ? "none" : "cam", c.name, c.sp, priceLine(c)); });
    h += '</div><h3>INS kamerası (aşağı bakar)</h3><div class="opts">';
    CAM_INS.forEach(function (c) { h += opt("camIns", c.id, c.id === "none" ? "none" : "cambox", c.name, c.sp + (c.lens ? " · mercek ayrıca eklenir" : ""), priceLine(c)); });
    h += '</div>';
    if (visionNeeded()) h += '<div class="note info">Vision kartı eklendi (' + money(OP.vision.cost) + ', Jetson dahil).</div>';
    return h;
  },
  function () {
    var h = '<h2>Operfly kartları</h2><p class="lead">Zorunlu kartlar kilitlidir. Fiyatlar malzeme maliyeti tahminidir, satış fiyatı değildir.</p><h3>Görev özellikleri</h3>';
    h += '<label class="chk"><input type="checkbox" data-k="gnssless"' + (S.gnssless ? " checked" : "") + '><span><b>GNSS\'siz uçuş</b><small>Vision gerektirir; INS kamerası önerilir</small></span><span></span></label>';
    h += '<label class="chk"><input type="checkbox" data-k="track"' + (S.track ? " checked" : "") + '><span><b>Hedef takibi</b><small>Vision gerektirir; seyir kamerası önerilir</small></span><span></span></label>';
    h += '<label class="chk"><input type="checkbox" data-k="swarm"' + (S.swarm ? " checked" : "") + '><span><b>Sürü uçuşu</b><small>Radio gerektirir (araçlar arası ağ ve çarpışma önleme)</small></span><span></span></label>';
    h += '<h3>Araç üstü</h3>';
    var req = {}; opAir().forEach(function (x) { req[x[0]] = x[1]; });
    ["core", "hub", "power", "nav", "rx"].forEach(function (k) { h += chkRow(k, OP[k], "zorunlu", true); });
    h += chkRow("radio", OP.radio, S.swarm ? "sürü için zorunlu" : "", S.swarm);
    if (req.vision) h += chkRow("vision", OP.vision, req.vision, true);
    if (req.air) h += chkRow("air", OP.air, req.air, true);
    if (req.engine) h += chkRow("engine", OP.engine, req.engine, true);
    ["range10", "range30", "range100", "cell", "shield"].forEach(function (k) { h += chkRow(k, OP[k], ""); });
    h += '<h3>Kumanda</h3><div class="opts">' + opt("ctrl", "pilot12", "ctrl", OP.pilot12.name, OP.pilot12.d, money(OP.pilot12.cost)) + opt("ctrl", "pilott", "ctrlT", OP.pilott.name, OP.pilott.d, money(OP.pilott.cost)) + opt("ctrl", "pilotpro", "ctrlP", OP.pilotpro.name, OP.pilotpro.d + "; yer radyosu gerekmez", money(OP.pilotpro.cost)) + '</div><h3>Yer tarafı</h3>';
    var gq = {}; opGround().forEach(function (x) { gq[x[0]] = x[1]; });
    if (gq.gr) { h += chkRow("gr", OP.gr, gq.gr, true) + chkRow("pca", OP.pca, gq.pca, true); }
    h += chkRow("base", OP.base, "santimetre hassasiyeti için") + chkRow("tracker", OP.tracker, "12 km menzilde yönlü anten için");
    return h + notes(calc().checks.filter(function (c) { return /Hub|Omurga|Shield|RTK|Tracker|Seyir kamerası var/.test(c.t); }));
  },
  function () {
    var R = calc(), h = '<h2>Özet</h2><div class="fig">' + svgAir() + '</div>';
    h += '<div class="kpis"><div class="kpi"><div class="v">' + num(S.mtow) + ' kg</div><div class="l">MTOW · faydalı yük ' + num(S.payload) + ' kg</div></div><div class="kpi"><div class="v">' + (R.endur ? (R.endur >= 90 ? num(R.endur / 60, 1) + " sa" : num(R.endur, 0) + " dk") : "—") + '</div><div class="l">tahmini uçuş süresi</div></div>' +
      '<div class="kpi"><div class="v">' + (isGas() ? (R.hpkg ? num(R.hpkg, 2) + " hp/kg" : "—") : (R.tw ? num(R.tw, 2) + " ×" : "—")) + '</div><div class="l">' + (isGas() ? "güç / ağırlık" : "itki / ağırlık") + '</div></div><div class="kpi"><div class="v">' + num(R.wFrame) + ' kg</div><div class="l">gövdeye kalan ağırlık</div></div></div>';
    var order = { bad: 0, warn: 1, info: 2, ok: 3 };
    h += '<h3>Denetimler</h3>' + notes(R.checks.slice().sort(function (a, b) { return order[a.lvl] - order[b.lvl]; }));
    function tbl(rows, op) {
      var t = '<table><thead><tr><th>Kalem</th><th class="n">Adet</th><th class="n">Tutar</th></tr></thead><tbody>', sum = 0;
      rows.forEach(function (x) { sum += x.total; t += '<tr><td>' + (x.src ? '<a href="' + x.src + '" target="_blank" rel="noopener">' + x.name + '</a>' : x.name) + '<small>' + (op ? x.d + " · " + x.why : (x.est ? "fiyat tahmini" : "web fiyatı") + (x.note ? " · " + x.note : "")) + '</small></td><td class="n">' + (op ? 1 : x.qty) + '</td><td class="n">' + money(x.total) + '</td></tr>'; });
      return t + '<tr class="sum"><td>Ara toplam</td><td></td><td class="n">' + money(sum) + '</td></tr></tbody></table>';
    }
    h += '<h3>Operfly ekosisteminden gerekenler · araç</h3>' + tbl(R.air, true) + '<h3>Operfly ekosisteminden gerekenler · yer</h3>' + tbl(R.ground, true) + '<h3>Satın alınacak hazır ürünler</h3>' + tbl(R.buy, false);
    h += '<div class="grand"><span>Toplam maliyet<br><small>Operfly ' + money(R.costOp) + ' + satın alma ' + money(R.costBuy) + '</small></span><b>' + money(R.total) + '</b></div>';
    h += '<button type="button" class="btn pri" id="copy">Listeyi kopyala</button> <button type="button" class="btn" id="reset">Baştan başla</button><div id="copyout"></div>';
    h += '<p class="foot">Dahil olmayanlar: gövde ve iniş takımı, antenler, şarj cihazı, nakliye, gümrük ve vergi. Operfly kart tutarları malzeme maliyeti tahminidir. Hazır ürün fiyatları ' + PRICE_DATE + ' tarihinde satıcı sayfalarından alınmıştır ve değişebilir; "tahmin" yazanlar satıcı fiyatına dayanmaz. İtki, süre ve ağırlık hesapları kaba kurallara dayanır; uçuştan önce üretici verileriyle ve yer testleriyle doğrulanmalıdır.</p>';
    return h;
  }
];

function summaryText() {
  var R = calc(), t = "OPERFLY DRON LİSTESİ\n" + (S.type === "mr" ? LAYOUTS[S.layout].name : (isGas() ? "Benzinli" : "Elektrikli") + " sabit kanat, " + num(+S.span) + " m") + " · MTOW " + num(S.mtow) + " kg · faydalı yük " + num(S.payload) + " kg\n\nOPERFLY (araç)\n";
  R.air.forEach(function (x) { t += "- " + x.name + ": " + money(x.total) + "\n"; });
  t += "\nOPERFLY (yer)\n"; R.ground.forEach(function (x) { t += "- " + x.name + ": " + money(x.total) + "\n"; });
  t += "\nSATIN ALINACAK\n"; R.buy.forEach(function (x) { t += "- " + x.qty + " × " + x.name + ": " + money(x.total) + (x.est ? " (tahmin)" : "") + "\n"; });
  t += "\nOperfly: " + money(R.costOp) + "\nSatın alma: " + money(R.costBuy) + "\nTOPLAM: " + money(R.total) + "\n\nUYARILAR\n";
  R.checks.forEach(function (c) { if (c.lvl === "bad" || c.lvl === "warn") t += "! " + c.t + "\n"; });
  return t;
}

function render(keepScroll) {
  var st = $("steps"), h = "";
  for (var i = 0; i < STEPS.length; i++) h += '<button type="button" data-step="' + i + '" class="' + (i === S.step ? "cur" : i < S.step ? "done" : "") + '" aria-label="' + (i + 1) + ". adım: " + STEPS[i] + '"></button>';
  st.innerHTML = h;
  $("stepname").textContent = (S.step + 1) + " / " + STEPS.length + " · " + STEPS[S.step];
  $("main").innerHTML = VIEW[S.step]();
  var R = calc();
  $("total").innerHTML = "Toplam <b>" + money(R.total) + "</b>";
  $("prev").disabled = S.step === 0;
  $("next").textContent = S.step === STEPS.length - 2 ? "Özeti gör" : "İleri";
  $("next").style.visibility = S.step === STEPS.length - 1 ? "hidden" : "visible";
  if (!keepScroll) window.scrollTo(0, 0);
  save();
}
function setVal(k, v) {
  if (k.indexOf("cm.") === 0) { S.cm[k.slice(3)] = v; return; }
  S[k] = v;
  if (k === "type") { if (v === "fw") { S.mtow = 70; S.payload = 10; S.range10 = false; S.range100 = true; } else { S.mtow = 30; S.payload = 2; S.range10 = true; S.range100 = false; } S.motor = ""; S.esc = ""; S.batt = ""; }
  if (k === "volt" || k === "fwDrive") { S.motor = ""; S.esc = ""; S.batt = ""; if (k === "fwDrive" && v === "gas") S.fwMotors = 1; }
  if (k === "motor") S.esc = "";
}
document.addEventListener("change", function (ev) {
  var t = ev.target, k = t.getAttribute && t.getAttribute("data-k"); if (!k) return;
  var v = t.type === "checkbox" ? t.checked : t.value;
  if (t.getAttribute("data-num") || k === "volt" || k === "fwMotors") { v = parseFloat(String(v).replace(",", ".")); if (isNaN(v)) v = 0; var mn = parseFloat(t.min), mx = parseFloat(t.max); if (!isNaN(mn) && v < mn) v = mn; if (!isNaN(mx) && v > mx) v = mx; }
  setVal(k, v); render(true);
});
document.addEventListener("click", function (ev) {
  var t = ev.target;
  if (t.getAttribute && t.getAttribute("data-step") !== null && t.getAttribute("data-step") !== undefined && t.parentNode === $("steps")) { S.step = +t.getAttribute("data-step"); render(); return; }
  if (t.id === "prev" && S.step > 0) { S.step--; render(); }
  else if (t.id === "next" && S.step < STEPS.length - 1) { S.step++; render(); }
  else if (t.id === "reset") { S = JSON.parse(JSON.stringify(DEF)); render(); }
  else if (t.id === "copy") {
    var txt = summaryText(), out = $("copyout");
    function fallback() { out.innerHTML = '<textarea class="copy" readonly aria-label="Kopyalanacak liste"></textarea>'; out.firstChild.value = txt; out.firstChild.select(); }
    try { navigator.clipboard.writeText(txt).then(function () { out.innerHTML = '<div class="note ok">Liste panoya kopyalandı.</div>'; }, fallback); } catch (e) { fallback(); }
  }
});
window.__operfly = { S: function () { return S; }, set: function (k, v) { setVal(k, v); }, calc: calc, render: render };
render();
})();
</script>
